name: Deploy com Atualização Automática

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar nova versão
        id: version
        run: |
          VERSION=$(TZ="America/Sao_Paulo" date +'%d.%m.%Y-%H%M')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "🆕 Versão gerada: $VERSION"

      - name: Atualizar sw.js
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "📝 Atualizando sw.js para versão: $VERSION"
          
          # Mostra antes
          echo "📄 Antes:"
          grep "const CACHE_VERSION" sw.js || echo "⚠️ Linha não encontrada"
          
          # Substitui a versão (funciona no Ubuntu)
          sed -i "s/const CACHE_VERSION = '.*'/const CACHE_VERSION = '${VERSION}'/" sw.js
          
          # Mostra depois
          echo "📄 Depois:"
          grep "const CACHE_VERSION" sw.js
          
          # Verifica se funcionou
          if grep -q "const CACHE_VERSION = '${VERSION}'" sw.js; then
            echo "✅ Versão atualizada com sucesso!"
          else
            echo "❌ Falha ao atualizar versão"
            exit 1
          fi

      - name: Configurar Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Commit e Push da versão atualizada
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git add sw.js
          if ! git diff --staged --quiet; then
            git commit -m "🔄 Atualiza CACHE_VERSION para ${VERSION}"
            git push
            echo "✅ Commit feito com versão ${VERSION}"
          else
            echo "ℹ️ Sem mudanças para commitar"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
